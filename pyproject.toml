[project]
name = "ruehrwerk"
version = "0.1.0"
description = "Begleit-App für Mealie: Kochmodus für Rezepte mit Thermomix®-Angaben (kompatibel mit Thermomix®)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["app", "app.parser"]
